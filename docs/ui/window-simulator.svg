<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Codex Health Monitor 窗口优化模拟器</title>
  <desc id="desc">参数维护、健康阈值、策略对比和工作时间轴的模拟器示意图。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs>
  <rect width="1200" height="650" rx="22" fill="#f4f7fb"/>
  <rect x="28" y="28" width="1144" height="594" rx="17" fill="#fff" filter="url(#shadow)"/>
  <circle cx="57" cy="60" r="14" fill="#dbeafe"/><path d="M49 64V57m8 7V52m8 12V55" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <text x="82" y="58" fill="#0f172a" font-size="19" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">窗口限额 · 预热对比模拟器</text>
  <text x="82" y="78" fill="#64748b" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">根据工作时间与窗口额度比较两种策略，并直接保存窗口优化配置。</text>
  <rect x="1014" y="45" width="130" height="26" rx="13" fill="#fff7ed"/><text x="1034" y="62" fill="#c2410c" font-size="10" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">有未保存修改</text>

  <rect x="50" y="102" width="330" height="492" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="72" y="134" fill="#334155" font-size="13" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">参数维护</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="170" fill="#64748b" font-size="10">窗口周期（小时）</text><rect x="226" y="151" width="126" height="30" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="241" y="171" fill="#0f172a" font-size="11" font-weight="650">5</text>
    <text x="72" y="209" fill="#64748b" font-size="10">单窗口预计可用时长</text><rect x="226" y="190" width="126" height="30" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="241" y="210" fill="#0f172a" font-size="11" font-weight="650">60 分钟</text>
    <text x="72" y="248" fill="#64748b" font-size="10">工作日开始</text><rect x="226" y="229" width="126" height="30" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="241" y="249" fill="#0f172a" font-size="11" font-weight="650">09:00</text>
    <text x="72" y="287" fill="#64748b" font-size="10">午休</text><rect x="226" y="268" width="126" height="30" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="241" y="288" fill="#0f172a" font-size="11" font-weight="650">12:00–13:30</text>
    <text x="72" y="326" fill="#64748b" font-size="10">工作日结束</text><rect x="226" y="307" width="126" height="30" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="241" y="327" fill="#0f172a" font-size="11" font-weight="650">19:00</text>
    <text x="72" y="365" fill="#64748b" font-size="10">最小健康阈值</text><rect x="226" y="346" width="126" height="30" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="241" y="366" fill="#0f172a" font-size="11" font-weight="650">80%</text>
    <text x="72" y="404" fill="#64748b" font-size="10">算法锚点</text><rect x="226" y="385" width="126" height="30" rx="7" fill="#fff" stroke="#93c5fd"/><text x="241" y="405" fill="#1d4ed8" font-size="11" font-weight="700">06:59</text>
    <text x="72" y="443" fill="#64748b" font-size="10">生效星期</text>
    <g font-size="9" font-weight="700"><rect x="72" y="455" width="30" height="27" rx="7" fill="#2563eb"/><text x="83" y="472" fill="#fff">一</text><rect x="108" y="455" width="30" height="27" rx="7" fill="#2563eb"/><text x="119" y="472" fill="#fff">二</text><rect x="144" y="455" width="30" height="27" rx="7" fill="#2563eb"/><text x="155" y="472" fill="#fff">三</text><rect x="180" y="455" width="30" height="27" rx="7" fill="#2563eb"/><text x="191" y="472" fill="#fff">四</text><rect x="216" y="455" width="30" height="27" rx="7" fill="#2563eb"/><text x="227" y="472" fill="#fff">五</text><rect x="252" y="455" width="30" height="27" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="263" y="472" fill="#64748b">六</text><rect x="288" y="455" width="30" height="27" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="299" y="472" fill="#64748b">日</text></g>
    <rect x="72" y="516" width="78" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="90" y="537" fill="#475569" font-size="10" font-weight="650">撤销修改</text>
    <rect x="160" y="516" width="82" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="178" y="537" fill="#475569" font-size="10" font-weight="650">重新计算</text>
    <rect x="252" y="516" width="100" height="34" rx="8" fill="#2563eb"/><text x="279" y="537" fill="#fff" font-size="10" font-weight="700">保存配置</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="406" y="102" width="738" height="118" rx="13" fill="#fff" stroke="#e2e8f0"/>
    <text x="428" y="129" fill="#64748b" font-size="10" font-weight="700">模拟结果</text>
    <rect x="428" y="145" width="158" height="53" rx="10" fill="#eff6ff"/><text x="443" y="164" fill="#64748b" font-size="9">当天总工作时长</text><text x="443" y="187" fill="#1d4ed8" font-size="19" font-weight="750">8小时30分</text>
    <rect x="596" y="145" width="158" height="53" rx="10" fill="#f8fafc"/><text x="611" y="164" fill="#64748b" font-size="9">策略 A 可用</text><text x="611" y="187" fill="#334155" font-size="19" font-weight="750">5小时</text>
    <rect x="764" y="145" width="158" height="53" rx="10" fill="#ecfdf5"/><text x="779" y="164" fill="#64748b" font-size="9">策略 B 可用</text><text x="779" y="187" fill="#047857" font-size="19" font-weight="750">7小时</text>
    <rect x="932" y="145" width="190" height="53" rx="10" fill="#f5f3ff"/><text x="947" y="164" fill="#64748b" font-size="9">推荐锚点</text><text x="947" y="187" fill="#6d28d9" font-size="19" font-weight="750">06:59</text>

    <rect x="406" y="236" width="355" height="100" rx="12" fill="#fff" stroke="#fecaca"/>
    <text x="428" y="263" fill="#0f172a" font-size="12" font-weight="750">策略 A · 上班时触发</text><text x="428" y="287" fill="#334155" font-size="21" font-weight="750">5小时</text>
    <rect x="518" y="272" width="52" height="22" rx="11" fill="#fee2e2"/><text x="533" y="287" fill="#b91c1c" font-size="10" font-weight="700">风险</text><text x="580" y="287" fill="#64748b" font-size="10">覆盖率 58.8% · 阈值 80%</text>
    <rect x="428" y="307" width="305" height="8" rx="4" fill="#e2e8f0"/><rect x="428" y="307" width="179" height="8" rx="4" fill="#f87171"/>

    <rect x="789" y="236" width="355" height="100" rx="12" fill="#fff" stroke="#bbf7d0"/>
    <text x="811" y="263" fill="#0f172a" font-size="12" font-weight="750">策略 B · 预热锚点</text><text x="811" y="287" fill="#334155" font-size="21" font-weight="750">7小时</text>
    <rect x="901" y="272" width="52" height="22" rx="11" fill="#dcfce7"/><text x="916" y="287" fill="#15803d" font-size="10" font-weight="700">健康</text><text x="963" y="287" fill="#64748b" font-size="10">覆盖率 82.4% · 阈值 80%</text>
    <rect x="811" y="307" width="305" height="8" rx="4" fill="#e2e8f0"/><rect x="811" y="307" width="251" height="8" rx="4" fill="#22c55e"/>

    <rect x="406" y="352" width="738" height="242" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="428" y="381" fill="#334155" font-size="12" font-weight="750">工作时间轴</text><text x="428" y="400" fill="#94a3b8" font-size="9">蓝色：可用 · 橙色：额度受限 · 灰色：午休</text>
    <g fill="#94a3b8" font-size="8"><text x="474" y="430">06:00</text><text x="590" y="430">09:00</text><text x="706" y="430">12:00</text><text x="822" y="430">15:00</text><text x="938" y="430">18:00</text><text x="1054" y="430">21:00</text></g>
    <text x="428" y="466" fill="#475569" font-size="10" font-weight="700">策略 A</text><rect x="492" y="451" width="620" height="26" rx="7" fill="#e2e8f0"/><rect x="608" y="451" width="116" height="26" rx="7" fill="#60a5fa"/><rect x="724" y="451" width="58" height="26" fill="#cbd5e1"/><rect x="782" y="451" width="116" height="26" rx="7" fill="#fbbf24"/><rect x="898" y="451" width="116" height="26" rx="7" fill="#60a5fa"/>
    <text x="428" y="532" fill="#475569" font-size="10" font-weight="700">策略 B</text><rect x="492" y="517" width="620" height="26" rx="7" fill="#e2e8f0"/><rect x="530" y="517" width="194" height="26" rx="7" fill="#60a5fa"/><rect x="724" y="517" width="58" height="26" fill="#cbd5e1"/><rect x="782" y="517" width="232" height="26" rx="7" fill="#60a5fa"/>
    <line x1="568" y1="442" x2="568" y2="554" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 4"/><rect x="525" y="554" width="86" height="23" rx="11" fill="#ede9fe"/><text x="539" y="569" fill="#6d28d9" font-size="9" font-weight="700">锚点 06:59</text>
  </g>
</svg>
